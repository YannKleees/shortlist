# Shortlist on Fly.io: always on, so mail is checked and notifications arrive while your laptop is off.
# About 3 to 4 euros a month for a small machine and a 1 GB disk. See "Put it online" in the README.
#   fly launch --no-deploy --copy-config     (pick a unique app name)
#   fly volumes create shortlist_data --size 1 --region ams
#   fly secrets set ANTHROPIC_API_KEY=sk-ant-...  SHORTLIST_PUBLIC_URL=https://<app>.fly.dev
#   fly deploy

app = "shortlist"
primary_region = "ams"

[env]
  SHORTLIST_DB = "/data/shortlist.db"
  SHORTLIST_BACKUPS = "/data/backups"

[mounts]
  source = "shortlist_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
