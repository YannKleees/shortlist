<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sift</title>
  <meta name="description" content="Your job search in one place.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sift">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="root" class="app" aria-live="polite"></div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
  <div id="menu" class="menu" popover role="menu"></div>
  <div id="toast" class="toast" popover="manual" role="status"></div>

  <noscript><p style="padding: 24px">Sift needs JavaScript.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
